version: '3.8'

services:
  web:
    build: .
    command: python app.py  # Ajustar el comando de inicio
    ports:
      - "5034:5034"
    environment:
      APP_SETTINGS: "config.DevelopmentConfig"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/clientes_db"
      LOGGING_FORMAT: "TEXT"
      FLASK_PORT: 5034
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clientes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

