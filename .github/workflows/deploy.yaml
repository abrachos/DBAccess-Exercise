name: CI/CD Pipeline

on:
  push:
    branches:
      - pipeline-setup

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::509399606070:role/githubactiontoaws  # Reemplaza con el ARN correcto de tu rol IAM
        aws-region: us-east-2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.0.11

    - name: Initialize Terraform
      run: terraform init -upgrade
      working-directory: terraform

    - name: Apply Terraform
      run: terraform apply -auto-approve
      working-directory: terraform

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./VirtualAccount
        push: true
        tags: ghcr.io/abrachos/virtualaccount:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Create .kube directory
      run: mkdir -p $HOME/.kube

    - name: Get EKS Token and update Kubeconfig
      run: |
        aws eks update-kubeconfig --region us-east-2 --name virtualaccount-cluster
        export KUBECONFIG=$HOME/.kube/config

    - name: Validate Kubeconfig
      run: |
        kubectl config get-contexts
        kubectl config current-context
        kubectl get nodes

    - name: Verify Access
      run: |
        kubectl get namespaces

    - name: Deploy to Kubernetes
      env:
        KUBECONFIG: $HOME/.kube/config
      run: |
        kubectl apply -f kubernetes/deployment.yaml
        kubectl apply -f kubernetes/service.yaml
