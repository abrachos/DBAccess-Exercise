apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: ghcr.io/abrachos/virtualaccount:latest1
        ports:
        - containerPort: 5034
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@clientes-db.cxus460ksq21.us-east-2.rds.amazonaws.com:5432/clientes_db"
      imagePullSecrets:
      - name: ghcr-secret
